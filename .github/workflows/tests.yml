name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Jest + Supertest + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: taskmanager_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d taskmanager_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5433/taskmanager_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage

  flutter:
    name: Flutter (analyze + unit + widget)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  e2e:
    name: End-to-end (Flutter Linux + API + PostgreSQL)
    runs-on: ubuntu-latest
    needs: [backend, flutter]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskmanager
          POSTGRES_PASSWORD: taskmanager
          POSTGRES_DB: taskmanager_e2e
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U taskmanager -d taskmanager_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://taskmanager:taskmanager@localhost:5434/taskmanager_e2e
      JWT_SECRET: solo-para-ci-e2e
      AUTH_RATE_LIMIT_MAX: '100'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Start API
        working-directory: backend
        run: |
          npm ci
          npm run db:migrate
          nohup npm start > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health && break; sleep 1; done
      - name: Smoke test
        working-directory: backend
        run: npm run smoke
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libsecret-1-dev libjsoncpp-dev xvfb
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Run integration test
        working-directory: mobile
        run: |
          flutter pub get
          xvfb-run -a flutter test integration_test -d linux
      - name: API log (sin tokens)
        if: always()
        working-directory: backend
        run: cat api.log || true
